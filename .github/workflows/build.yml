name: Build BakkesMod Plugin

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4


    - name: Checkout BakkesMod SDK
      uses: actions/checkout@v4
      with:
        repository: bakkesmodorg/BakkesModSDK
        path: bakkesmod\bakkesmodsdk


    - name: Check for vcpkg manifest
      id: vcpkg_check
      shell: pwsh
      run: |
        $manifest = Test-Path "$env:GITHUB_WORKSPACE/vcpkg.json"
        Write-Host "vcpkg manifest present: $manifest"
        echo "vcpkg_manifest=$manifest" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

    - name: Checkout vcpkg
      if: steps.vcpkg_check.outputs.vcpkg_manifest == 'True'
      uses: actions/checkout@v4
      with:
        repository: microsoft/vcpkg
        path: vcpkg

    - name: Bootstrap vcpkg
      if: steps.vcpkg_check.outputs.vcpkg_manifest == 'True'
      run: |
        .\vcpkg\bootstrap-vcpkg.bat

    - name: Integrate vcpkg
      if: steps.vcpkg_check.outputs.vcpkg_manifest == 'True'
      run: |
        .\vcpkg\vcpkg.exe integrate install


    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Find solution file
      id: find_sln
      shell: pwsh
      run: |
        $sln = Get-ChildItem -Path $env:GITHUB_WORKSPACE -Filter *.sln -Recurse | Select-Object -First 1
        if ($null -eq $sln) { Write-Error 'No .sln file found!'; exit 1 }
        Write-Host "sln path: $($sln.FullName)"
        echo "SOLUTION_PATH=$($sln.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

    - name: Build
      run: msbuild /m /p:Configuration=Release /p:BakkesModPath=$env:GITHUB_WORKSPACE\bakkesmod /p:PostBuildEventUseInBuild=false $env:SOLUTION_PATH


    - name: Prepare build artifacts
      shell: pwsh
      run: |
        # Mirror the BakkesMod data directory layout so the zip can be extracted
        # directly into %APPDATA%\bakkesmod\bakkesmod\

        # plugins/SuiteSpot.dll
        New-Item -ItemType Directory -Force -Path "artifacts/plugins" | Out-Null
        Get-ChildItem -Path "plugins" -Include "*.dll","*.pdb" -Recurse |
          ForEach-Object { Copy-Item $_.FullName -Destination "artifacts/plugins" -Force }

        # data/fonts/
        New-Item -ItemType Directory -Force -Path "artifacts/data/fonts" | Out-Null
        Copy-Item -Path "assets/fonts/*" -Destination "artifacts/data/fonts" -Force

        # data/SuiteSpot/Resources/Icons/
        New-Item -ItemType Directory -Force -Path "artifacts/data/SuiteSpot/Resources/Icons" | Out-Null
        Copy-Item -Path "assets/icons/*" -Destination "artifacts/data/SuiteSpot/Resources/Icons" -Force

        # data/SuiteSpot/Resources/logos/
        New-Item -ItemType Directory -Force -Path "artifacts/data/SuiteSpot/Resources/logos" | Out-Null
        Copy-Item -Path "assets/logos/*" -Destination "artifacts/data/SuiteSpot/Resources/logos" -Force

        # data/SuiteSpot/Resources/NoPreview.jpg
        Copy-Item -Path "assets/images/NoPreview.jpg" -Destination "artifacts/data/SuiteSpot/Resources" -Force

        # data/SuiteSpot/TrainingSuite/training_packs.json
        New-Item -ItemType Directory -Force -Path "artifacts/data/SuiteSpot/TrainingSuite" | Out-Null
        Copy-Item -Path "assets/data/training_packs.json" -Destination "artifacts/data/SuiteSpot/TrainingSuite" -Force

        # data/SuiteSpot/Workshop/NoPreview.jpg
        New-Item -ItemType Directory -Force -Path "artifacts/data/SuiteSpot/Workshop" | Out-Null
        Copy-Item -Path "assets/images/NoPreview.jpg" -Destination "artifacts/data/SuiteSpot/Workshop" -Force

        Write-Host "Artifacts contents:"
        Get-ChildItem -Path "artifacts" -Recurse | Select-Object FullName

    - name: Create release archive
      run: |
        # Create zip file with timestamp
        $timestamp = Get-Date -Format "yyyyMMdd-HHmmss"
        $zipName = "${{ github.event.repository.name }}-$timestamp.zip"

        if (Test-Path "artifacts") {
          Compress-Archive -Path "artifacts\*" -DestinationPath $zipName
          echo "RELEASE_ZIP=$zipName" >> $env:GITHUB_ENV
        } else {
          Write-Error "No artifacts found to archive"
          exit 1
        }

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ github.event.repository.name }}
        path: ${{ env.RELEASE_ZIP }}
        retention-days: 30
